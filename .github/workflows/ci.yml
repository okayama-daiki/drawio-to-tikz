name: CI

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: true

            - name: Install project (dev only)
              run: uv sync --locked --dev

            - name: Run linters
              run: |
                  uv run ruff check .
                  uv run basedpyright

    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: true

            - name: Build package
              run: uv build

            - name: Verify wheel installation
              run: |
                  wheel_path="$(realpath dist/*.whl)"
                  smoke_dir="$(mktemp -d)"
                  uv venv --python 3.14 "${smoke_dir}/venv"
                  uv pip install --python "${smoke_dir}/venv/bin/python" "${wheel_path}"
                  cd "${smoke_dir}"
                  "${smoke_dir}/venv/bin/python" -m drawio2tikz --version

            - name: Build container image
              run: docker build --platform linux/amd64 --tag drawio2tikz:ci .

    test:
        runs-on: ubuntu-latest
        needs: [lint, build]
        strategy:
            matrix:
                python-version: ["3.14"]
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv and set Python
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: true
                  python-version: ${{ matrix.python-version }}

            - name: Install the project
              run: uv sync --locked --all-extras --dev

            - name: Run tests with coverage
              run: uv run pytest -v --cov=drawio2tikz --cov-report=xml

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              if: ${{ matrix.python-version == '3.14' && github.ref == 'refs/heads/main' }}
              with:
                  files: ./coverage.xml
                  fail_ci_if_error: false
                  use_oidc: true

    deploy:
        name: Deploy to Cloud Run
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        needs: [test]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        env:
            GCP_PROJECT_ID: drawio2tikz
            GCP_REGION: asia-northeast1
            CLOUD_RUN_SERVICE: drawio2tikz
            CONTAINER_IMAGE: asia-northeast1-docker.pkg.dev/drawio2tikz/cloud-run-source-deploy/drawio2tikz

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - id: auth
              name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

            - name: Set up Google Cloud CLI
              uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

            - name: Authenticate Docker to Artifact Registry
              run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - id: build_image
              name: Build and push container image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ env.CONTAINER_IMAGE }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false

            - id: deploy
              name: Deploy to Cloud Run
              uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
              with:
                  project_id: ${{ env.GCP_PROJECT_ID }}
                  region: ${{ env.GCP_REGION }}
                  service: ${{ env.CLOUD_RUN_SERVICE }}
                  image: ${{ env.CONTAINER_IMAGE }}:${{ github.sha }}
                  env_vars: DRAWIO2TIKZ_REQUIRE_ORIGIN_AUTH=1
                  secrets: ORIGIN_AUTH_TOKEN=drawio2tikz-origin-auth:latest
                  flags: >-
                      --service-account=drawio2tikz-runtime@drawio2tikz.iam.gserviceaccount.com
                      --min=0
                      --max=1
                      --min-instances=0
                      --max-instances=1
                      --concurrency=1
                      --cpu=1
                      --memory=1Gi
                      --timeout=300s
                      --cpu-throttling
                      --no-cpu-boost

            - name: Verify deployment
              env:
                  ORIGIN_AUTH_TOKEN: ${{ secrets.ORIGIN_AUTH_TOKEN }}
              run: |
                  curl --fail --show-error --silent \
                    --retry 10 --retry-delay 5 \
                    --header "X-Drawio2Tikz-Origin-Token: ${ORIGIN_AUTH_TOKEN}" \
                    "${{ steps.deploy.outputs.url }}/health"

                  curl --fail-with-body --show-error --silent \
                    --header "X-Drawio2Tikz-Origin-Token: ${ORIGIN_AUTH_TOKEN}" \
                    --form "file=@example/sample.drawio;type=application/xml" \
                    "${{ steps.deploy.outputs.url }}/api/convert" \
                    | jq --exit-status '.files | length == 1 and .[0].filename == "sample.tex"' \
                    >/dev/null

            - name: Delete transient container image
              if: ${{ always() && steps.build_image.outcome == 'success' }}
              env:
                  IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
              run: >-
                  gcloud artifacts docker images delete
                  "${CONTAINER_IMAGE}@${IMAGE_DIGEST}"
                  --delete-tags
                  --quiet

    deploy-cloudflare:
        name: Deploy Cloudflare Worker
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        needs: [deploy]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Deploy Worker
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: cloudflare
                  wranglerVersion: "4.126.0"
                  secrets: |
                      ORIGIN_AUTH_TOKEN
              env:
                  ORIGIN_AUTH_TOKEN: ${{ secrets.ORIGIN_AUTH_TOKEN }}

            - name: Verify custom domain
              run: >-
                  curl --fail --show-error --silent
                  --retry 12 --retry-delay 10 --retry-all-errors
                  https://drawio2tikz.daiki.dev/health
