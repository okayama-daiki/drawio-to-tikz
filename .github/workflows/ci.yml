name: CI

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libcairo2-dev libjpeg-dev libgirepository-1.0-dev libgirepository-2.0-dev libxml2-dev libxslt1-dev

            - name: Install project (dev only)
              run: uv sync --locked --dev

            - name: Run linters
              run: |
                  uv run ruff check .
                  uv run basedpyright

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Build package
              run: uv build

    test:
        runs-on: ubuntu-latest
        needs: [lint, build]
        strategy:
            matrix:
                python-version: ["3.14"]
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v6

            - name: Install uv and set Python
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: ${{ matrix.python-version }}

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libcairo2-dev libjpeg-dev libgirepository-1.0-dev libgirepository-2.0-dev libxml2-dev libxslt1-dev

            - name: Install the project
              run: uv sync --locked --all-extras --dev

            - name: Run tests with coverage
              run: uv run pytest -v --cov=drawio2tikz --cov-report=xml

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              if: ${{ matrix.python-version == '3.14' && github.ref == 'refs/heads/main' }}
              with:
                  files: ./coverage.xml
                  fail_ci_if_error: false
                  use_oidc: true

    deploy:
        name: Deploy to Cloud Run
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        needs: [test]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        env:
            GCP_PROJECT_ID: drawio2tikz
            GCP_REGION: asia-northeast1
            CLOUD_RUN_SERVICE: drawio2tikz
            CONTAINER_IMAGE: asia-northeast1-docker.pkg.dev/drawio2tikz/cloud-run-source-deploy/drawio2tikz

        steps:
            - uses: actions/checkout@v6

            - id: auth
              name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

            - name: Set up Google Cloud CLI
              uses: google-github-actions/setup-gcloud@v3

            - name: Authenticate Docker to Artifact Registry
              run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - id: build_image
              name: Build and push container image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ env.CONTAINER_IMAGE }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false

            - id: deploy
              name: Deploy to Cloud Run
              uses: google-github-actions/deploy-cloudrun@v3
              with:
                  project_id: ${{ env.GCP_PROJECT_ID }}
                  region: ${{ env.GCP_REGION }}
                  service: ${{ env.CLOUD_RUN_SERVICE }}
                  image: ${{ env.CONTAINER_IMAGE }}:${{ github.sha }}
                  flags: >-
                      --min=0
                      --max=1
                      --min-instances=0
                      --max-instances=1
                      --concurrency=1
                      --cpu=1
                      --memory=1Gi
                      --timeout=300s
                      --cpu-throttling

            - name: Verify deployment
              run: curl --fail --show-error --silent --retry 10 --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"

            - name: Delete transient container image
              if: ${{ always() && steps.build_image.outcome == 'success' }}
              env:
                  IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
              run: >-
                  gcloud artifacts docker images delete
                  "${CONTAINER_IMAGE}@${IMAGE_DIGEST}"
                  --delete-tags
                  --quiet
