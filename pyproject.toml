[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[project]
name = "drawio2tikz"
version = "0.6.0"
description = "Convert diagrams.net/draw.io diagrams to TikZ via SVG."
readme = "README.md"
authors = [{ name = "Daiki Okayama", email = "lawliet.d.k.m@gmail.com" }]
requires-python = ">=3.14"
license = "MIT"
keywords = ["drawio", "diagrams.net", "svg", "tikz", "latex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "defusedxml>=0.7.1",
  "fastapi>=0.141.1",
  "idna>=3.19",
  "pillow>=12.3.0",
  "python-multipart>=0.0.32",
  "rich>=15.0",
  "starlette>=1.6.0",
  "typer>=0.27.1",
  "uvicorn[standard]>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/okayama-daiki/drawio2tikz"
Issues = "https://github.com/okayama-daiki/drawio2tikz/issues"

[project.scripts]
drawio2tikz = "drawio2tikz.cli:app"
drawio2tikz-web = "drawio2tikz.web:run"

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "httpx2>=2.12.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E501", # Line too long
  "D203", # Insert 1 blank line before class docstring
  "D213", # Multi-line docstring summary should start at the next line
  "S101", # Use of assert (standard in pytest)
  "COM812", # Formatter handles trailing commas
  "CPY001", # Copyright notices are managed at the repository level
  "PLR0913", # Too many arguments (CLI requirement for Typer)
]

[tool.basedpyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
stubPath = "./stubs"

[tool.uv.workspace]
members = ["test"]
